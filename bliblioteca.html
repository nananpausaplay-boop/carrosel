<!DOCTYPE html>

    <title>Document</title>
    <link rel="stylesheet" href="CSS/bliblioteca.css">
</head>
<body>

        <h2>Cadastrar Livro</h2>

        <h2>Pesquisar Livros</h2>

        <h2>Estante</h2>
        <div id="Estante">

        </div>
    </div>
    <script src="JS/bliblioteca.js"></script>
